services:
  api:
    build: .
    container_name: lumen-support-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uv", "run", "fastapi", "run", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]

  poller:
    build: .
    container_name: lumen-support-poller
    restart: unless-stopped
    env_file: .env
    command: ["uv", "run", "python", "-m", "app.poller"]
